<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Important Question 💖</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  max-width: 420px;
  width: 90%;
  position: relative;
}

h1 {
  color: #ff4b7d;
  margin-top: 0;
}

.buttons {
  margin-top: 25px;
  position: relative;
  height: 140px;
}

button {
  padding: 14px 28px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  position: absolute;
  transition: 0.2s;
}

#yesBtn {
  background: #ff4b7d;
  color: white;
  left: 15%;
}

#noBtn {
  background: #ccc;
  color: #333;
  right: 15%;
}

#meterBox {
  margin-top: 15px;
}

#meter {
  height: 12px;
  background: #eee;
  border-radius: 10px;
  overflow: hidden;
}

#fill {
  height: 100%;
  width: 0%;
  background: #ff4b7d;
  transition: 0.3s;
}

#result {
  font-size: 22px;
  color: #ff4b7d;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="card">

  <h1>Important Question 💖</h1>

  <!-- 💖 HARD-CODED NAMES -->
  <h2 id="question">Will you be mine forever? 💕</h2>

  <div class="buttons">
    <button id="yesBtn">YES ❤️</button>
    <button id="noBtn">NO 😢</button>
  </div>

  <div id="meterBox">
    Love Meter 💗
    <div id="meter"><div id="fill"></div></div>
  </div>

  <div id="result"></div>

</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_9c4d7d2f50.mp3?filename=romantic-ambient-piano-110624.mp3" type="audio/mpeg">
</audio>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const result = document.getElementById("result");
const fill = document.getElementById("fill");
const music = document.getElementById("music");

// 💖 CHANGE THESE NAMES
const yourName = "YourName";
const herName = "HerName";

let meter = 0;

// Start music on first interaction
document.body.addEventListener("click", () => {
  music.play().catch(()=>{});
}, { once: true });

yesBtn.onclick = () => {
  result.innerHTML =
    `YAYYY 💕<br>Namritha, you just made Kkrish the happiest person alive 🥰`;
  createHearts();
};

noBtn.addEventListener("mouseover", escape);
noBtn.addEventListener("click", escape);
noBtn.addEventListener("touchstart", escape);

function escape() {
  if (navigator.vibrate) navigator.vibrate(120);

  meter += 10;
  fill.style.width = meter + "%";

  const card = document.querySelector(".card");

  const maxX = card.clientWidth - noBtn.offsetWidth;
  const maxY = card.clientHeight - noBtn.offsetHeight;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

function createHearts() {
  for (let i = 0; i < 30; i++) {
    const heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.style.position = "fixed";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.top = "100vh";
    heart.style.fontSize = "24px";
    heart.style.animation = "float 2s linear forwards";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 2000);
  }
}

const style = document.createElement("style");
style.innerHTML = `
@keyframes float {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-120vh); opacity: 0; }
}`;
document.head.appendChild(style);
</script>

</body>
</html>
