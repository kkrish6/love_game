<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Important Question 💖</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  max-width: 400px;
  width: 90%;
  position: relative;
}

h1 {
  color: #ff4b7d;
  margin-top: 0;
}

.buttons {
  margin-top: 30px;
  position: relative;
  height: 120px;
}

button {
  padding: 14px 28px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  position: absolute;
  transition: 0.2s;
}

#yesBtn {
  background: #ff4b7d;
  color: white;
  left: 20%;
}

#noBtn {
  background: #ccc;
  color: #333;
  right: 20%;
}

#result {
  font-size: 22px;
  color: #ff4b7d;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="card">
  <h1>Will you be mine forever? 💖</h1>

  <div class="buttons">
    <button id="yesBtn">YES ❤️</button>
    <button id="noBtn">NO 😢</button>
  </div>

  <div id="result"></div>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const result = document.getElementById("result");

yesBtn.addEventListener("click", () => {
  result.innerHTML = "YAYYY 💕 I knew it!!! 🥰";
  createHearts();
});

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("click", moveButton);

function moveButton() {
  const card = document.querySelector(".card");

  const maxX = card.clientWidth - noBtn.offsetWidth - 20;
  const maxY = card.clientHeight - noBtn.offsetHeight - 20;

  const newX = Math.random() * maxX;
  const newY = Math.random() * maxY;

  noBtn.style.left = newX + "px";
  noBtn.style.top = newY + "px";
}

function createHearts() {
  for (let i = 0; i < 20; i++) {
    const heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.style.position = "fixed";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.top = "100vh";
    heart.style.fontSize = "24px";
    heart.style.animation = "float 2s linear forwards";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 2000);
  }
}

const style = document.createElement("style");
style.innerHTML = `
@keyframes float {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-120vh); opacity: 0; }
}`;
document.head.appendChild(style);
</script>

</body>
</html>
